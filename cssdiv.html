<!doctype html>
<html>
<head>
<style>
div{
width:200px;
height:200px;
border:2x solid black;
background-color:yellow;
margin:100px;
box-shadow:15px 15px 5px black;
animation:dasa infinite 1s alternate;
}

@keyframes dasa{
10%{
transform:translateX(300PX);
}


50%{
transform:translateY(300PX);
}


80%{
transform:rotate(45deg);
}





}
</style>
</body>
<div>

</div>

</body>
</html>
